# CI (arbxz-practices): the same checks as the pre-push hook, the version check on PRs into
# main, and Lighthouse against the production build (lighthouserc.json starts `pnpm start`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present check
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build
      - name: Version went up
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/check-version.mjs --base origin/main --head HEAD
      - name: Lighthouse
        if: hashFiles('lighthouserc.json') != ''
        run: pnpm exec lhci autorun
